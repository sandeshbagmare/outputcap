<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="outputcap: keep a huge tool result out of the context window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(196 68% 12%)">
        <animate attributeName="stop-color" values="hsl(196 68% 12%);hsl(196 62% 20%);hsl(196 68% 12%)" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="hsl(196 62% 20%)">
        <animate attributeName="stop-color" values="hsl(196 62% 20%);hsl(196 68% 12%);hsl(196 62% 20%)" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="hsl(246 88% 66%)" stop-opacity="0.34"/>
      <stop offset="1" stop-color="hsl(246 88% 66%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="hsl(196 40% 40%)" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
